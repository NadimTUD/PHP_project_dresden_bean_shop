services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bean_shop
      POSTGRES_USER: bean_shop
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./database/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "bean_shop", "-d", "bean_shop"]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    image: postgres:17
    environment:
      PGPASSWORD: local-demo-only
    volumes:
      - ./database/03-customers.sql:/migrations/03-customers.sql:ro
      - ./database/04-accounts.sql:/migrations/04-accounts.sql:ro
      - ./database/05-inventory.sql:/migrations/05-inventory.sql:ro
      - ./database/06-order-workflow.sql:/migrations/06-order-workflow.sql:ro
      - ./database/07-reorder-threshold.sql:/migrations/07-reorder-threshold.sql:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-h", "db", "-U", "bean_shop", "-d", "bean_shop", "-f", "/migrations/03-customers.sql", "-f", "/migrations/04-accounts.sql", "-f", "/migrations/05-inventory.sql", "-f", "/migrations/06-order-workflow.sql", "-f", "/migrations/07-reorder-threshold.sql"]
  web:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: bean_shop
      DB_USER: bean_shop
      DB_PASSWORD: local-demo-only
      STAFF_SETUP_TOKEN: ${STAFF_SETUP_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/google.php}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  db-data:
